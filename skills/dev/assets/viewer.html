<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dev viewer</title>
<!-- /dev の成果物ビューア。使い方: viewer.html?dir=file:///abs/path/tmp/issues/<issue>/#<page>  (Chrome を --allow-file-access-from-files 付きで起動すること) -->
<style>
  :root { --bg:#f6f8fa; --panel:#fff; --text:#1f2328; --muted:#656d76; --accent:#0969da; --border:#d0d7de;
          --ok:#1a7f37; --new:#bf8700; --miss:#c9d1d9; --run:#8250df; --wait:#bc4c00; --del:#cf222e;
          --add-bg:#dafbe1; --add-ln:#aceebb; --del-bg:#ffebe9; --del-ln:#ffcecb; --hunk-bg:#ddf4ff;
          --hl-kw:#cf222e; --hl-str:#0a3069; --hl-cmt:#6e7781; --hl-num:#0550ae; --hl-fn:#8250df; --hl-typ:#953800; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --border:#30363d; --miss:#30363d; --wait:#f0883e; --del:#f85149;
          --add-bg:rgba(46,160,67,0.15); --add-ln:rgba(46,160,67,0.3); --del-bg:rgba(248,81,73,0.15); --del-ln:rgba(248,81,73,0.3); --hunk-bg:rgba(56,139,253,0.15);
          --hl-kw:#ff7b72; --hl-str:#a5d6ff; --hl-cmt:#8b949e; --hl-num:#79c0ff; --hl-fn:#d2a8ff; --hl-typ:#ffa657; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; }
  nav { width:220px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border); }
  nav header { padding:12px 14px; border-bottom:1px solid var(--border); }
  nav header h1 { margin:0; font-size:14px; }
  nav header .meta { color:var(--muted); font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  nav ul { list-style:none; margin:0; padding:6px 0; flex:1; overflow:auto; }
  nav li { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; border-left:3px solid transparent; }
  nav li:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  nav li.active { border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); font-weight:600; }
  nav li.missing { color:var(--muted); cursor:default; }
  nav li.running { color:var(--text); background:color-mix(in srgb, var(--run) 8%, transparent); }
  nav li.running.active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  nav li .dot { width:8px; height:8px; border-radius:50%; background:var(--miss); flex:none; }
  nav li.present .dot { background:var(--ok); }
  nav li.updated .dot { background:var(--new); box-shadow:0 0 0 3px color-mix(in srgb, var(--new) 30%, transparent); }
  nav li.running .dot { background:var(--run); box-shadow:0 0 0 3px color-mix(in srgb, var(--run) 30%, transparent); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  nav li.waiting .dot { background:var(--wait); box-shadow:0 0 0 3px color-mix(in srgb, var(--wait) 35%, transparent); animation:blink .9s steps(2, start) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  nav li .step { color:var(--muted); font-size:11px; margin-left:auto; }
  nav li.running .step { color:var(--run); font-weight:600; }
  nav li.waiting .step { color:var(--wait); font-weight:600; }
  nav.waiting header { background:color-mix(in srgb, var(--wait) 12%, transparent); border-bottom-color:var(--wait); }
  nav footer { padding:8px 14px; border-top:1px solid var(--border); color:var(--muted); font-size:11px; display:flex; gap:8px; align-items:center; }
  nav footer label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  main .bar { height:34px; flex:none; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; }
  main .bar b { color:var(--text); }
  main .bar a { color:var(--accent); text-decoration:none; margin-left:auto; }
  .waitpill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:12px; background:var(--wait); color:#fff; font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
  .waitpill[hidden] { display:none; }
  .runpill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:12px; background:color-mix(in srgb, var(--run) 18%, transparent); color:var(--run); font-weight:600; font-size:12px; white-space:nowrap; cursor:pointer; }
  .runpill .dot { width:7px; height:7px; border-radius:50%; background:var(--run); animation:pulse 1.2s infinite; }
  .runpill[hidden] { display:none; }
  .banner { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; padding:12px 16px; margin-bottom:16px; border-radius:8px; border:1px solid var(--wait); background:color-mix(in srgb, var(--wait) 12%, transparent); }
  .banner b { color:var(--wait); font-size:14px; }
  .banner .note { flex-basis:100%; }
  .runbanner { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:10px 14px; margin-bottom:14px; border-radius:8px; border:1px solid var(--run); background:color-mix(in srgb, var(--run) 10%, transparent); }
  .runbanner b { color:var(--run); }
  iframe { flex:1; border:0; width:100%; background:#fff; }
  .empty { flex:1; display:grid; place-items:center; color:var(--muted); }
  #dash, #diff { flex:1; overflow:auto; padding:20px 24px; }
  #dash[hidden], #diff[hidden] { display:none; }
  #dash h2 { font-size:15px; margin:22px 0 8px; }
  #dash h2:first-child { margin-top:0; }
  .diff-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
  .diff-stat-add { color:var(--ok); font-weight:600; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .diff-stat-del { color:var(--del); font-weight:600; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .diff-btn { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer; }
  .diff-btn:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .diff-btn.active { background:color-mix(in srgb, var(--accent) 15%, var(--panel)); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .diff-seg { display:inline-flex; }
  .diff-seg .diff-btn { border-radius:0; }
  .diff-seg .diff-btn:first-child { border-radius:6px 0 0 6px; }
  .diff-seg .diff-btn:last-child { border-radius:0 6px 6px 0; margin-left:-1px; }
  .diff-seg .diff-btn.active { position:relative; z-index:1; }
  .diff-toc { display:flex; flex-direction:column; gap:4px; margin-bottom:16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
  .diff-toc-item { display:flex; align-items:center; gap:8px; font-size:12px; text-decoration:none; color:var(--text); padding:3px 4px; border-radius:4px; }
  .diff-toc-item:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .diff-toc-item .path { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; flex:1; }
  .diff-toc-item.viewed .path { color:var(--muted); text-decoration:line-through; }
  .diff-file { background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-bottom:14px; overflow:hidden; }
  .diff-file.viewed { border-color:color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .diff-file > summary { display:flex; align-items:center; gap:8px; padding:8px 12px; background:color-mix(in srgb, var(--muted) 6%, var(--panel)); border-bottom:1px solid var(--border); cursor:pointer; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; font-weight:600; user-select:none; }
  .diff-file:not([open]) > summary { border-bottom:0; }
  .diff-file > summary .stats { margin-left:auto; display:flex; gap:6px; font-weight:500; align-items:center; }
  .diff-viewed { display:inline-flex; align-items:center; gap:4px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:11px; font-weight:500; color:var(--muted); padding:2px 7px; border:1px solid var(--border); border-radius:5px; background:var(--panel); cursor:pointer; margin-left:6px; }
  .diff-viewed.is-viewed { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--border)); background:color-mix(in srgb, var(--ok) 10%, var(--panel)); font-weight:600; }
  .diff-viewed input, .diff-check { margin:0; cursor:pointer; accent-color:var(--ok); }
  .diff-wrap { overflow-x:auto; }
  table.diff-tbl { width:100%; border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.45; }
  table.diff-tbl td { padding:0 8px; vertical-align:top; white-space:pre; }
  table.diff-tbl td.ln { width:1%; min-width:42px; text-align:right; color:var(--muted); user-select:none; border-right:1px solid var(--border); padding:0 6px; }
  table.diff-tbl tr.d-hunk td { background:var(--hunk-bg); color:var(--muted); padding:3px 8px; }
  table.diff-tbl tr.d-add td.code, table.diff-tbl td.d-add.code { background:var(--add-bg); }
  table.diff-tbl tr.d-add td.ln, table.diff-tbl td.d-add.ln { background:var(--add-ln); color:var(--text); }
  table.diff-tbl tr.d-del td.code, table.diff-tbl td.d-del.code { background:var(--del-bg); }
  table.diff-tbl tr.d-del td.ln, table.diff-tbl td.d-del.ln { background:var(--del-ln); color:var(--text); }
  table.diff-tbl tr.d-meta td { color:var(--muted); font-style:italic; }
  table.diff-tbl.split { table-layout:fixed; }
  table.diff-tbl.split td.ln { width:44px; min-width:44px; }
  table.diff-tbl.split td.ln.split-sep { border-left:1px solid var(--border); }
  table.diff-tbl.split td.code { width:calc(50% - 44px); white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
  table.diff-tbl td.d-empty { background:color-mix(in srgb, var(--muted) 6%, var(--panel)); }
  .d-sign { display:inline-block; width:1.2ch; user-select:none; color:var(--muted); }
  .hl-k { color:var(--hl-kw); }
  .hl-s { color:var(--hl-str); }
  .hl-c { color:var(--hl-cmt); font-style:italic; }
  .hl-n { color:var(--hl-num); }
  .hl-f { color:var(--hl-fn); }
  .hl-t { color:var(--hl-typ); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .card .k { color:var(--muted); font-size:11px; }
  .card .v { font-size:15px; font-weight:600; margin-top:2px; word-break:break-all; }
  .progress { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:10px 0 4px; }
  .progress i { display:block; height:100%; background:var(--ok); }
  table.t { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  table.t th, table.t td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.t th { color:var(--muted); font-weight:500; font-size:11px; }
  table.t tr:last-child td { border-bottom:0; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; }
  .b-done { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
  .b-skip { background:color-mix(in srgb, var(--muted) 18%, transparent); color:var(--muted); }
  .b-run  { background:color-mix(in srgb, var(--run) 18%, transparent); color:var(--run); }
  .b-todo { color:var(--muted); }
  .b-fail { background:color-mix(in srgb, #cf222e 18%, transparent); color:#cf222e; }
  .b-wait { background:var(--wait); color:#fff; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .muted { color:var(--muted); }
  .note { font-size:12px; color:var(--muted); }
  a.issue { color:var(--accent); text-decoration:none; }
  a.issue:hover { text-decoration:underline; }
  .empty[hidden] { display:none; }
</style>
</head>
<body>
<nav>
  <header><h1 id="title">dev viewer</h1><div class="meta" id="meta"></div></header>
  <ul id="list"></ul>
  <footer><label><input type="checkbox" id="auto" checked> 自動更新</label><span id="status"></span></footer>
</nav>
<main>
  <div class="bar"><span>表示中:</span><b id="cur">—</b><span id="curStep"></span><span id="runBar" class="runpill" hidden></span><span id="waitBar" class="waitpill" hidden></span><a id="raw" target="_blank">別タブで開く ↗</a></div>
  <div id="dash" hidden></div>
  <div id="diff" hidden></div>
  <iframe id="frame" hidden></iframe>
  <div class="empty" id="empty">左の一覧から成果物を選択</div>
</main>
<script>
const PAGES = [
  { key:'dashboard',   label:'dashboard',   file:null,                       step:null },
  { key:'research',    label:'research',    file:'research.html',            step:'research' },
  { key:'plan',        label:'plan',        file:'plan.html',                step:'plan' },
  { key:'checklist',   label:'checklist',   file:'checklist.html',           step:'plan' },
  { key:'review-plan', label:'review-plan', file:'review-plan.html',         step:'review-plan' },
  { key:'implement',   label:'implement',   file:'diff.patch',               step:'implement', diff:true },
  { key:'report',      label:'report',      file:'report.html',              step:'implement' },
  { key:'compare',     label:'compare',     file:'screenshots/compare.html', step:'test' },
  { key:'review',      label:'review',      file:'review.html',              step:'review' },
  { key:'quiz',        label:'quiz',        file:'quiz.html',                step:'quiz' },
];
const params = new URLSearchParams(location.search);
let dir = params.get('dir') || new URL('.', location.href).href;   // 同じディレクトリに置けば ?dir= 不要
if (!dir.endsWith('/')) dir += '/';
const VIEWED_KEY = `dev-viewer:viewed:${dir}`;
const VIEW_MODE_KEY = 'dev-viewer:diff-view';
let savedViewed = {}, savedViewMode = 'unified';
try { savedViewed = JSON.parse(localStorage.getItem(VIEWED_KEY) || '{}') || {}; } catch {}
try { const m = localStorage.getItem(VIEW_MODE_KEY); if (m === 'split' || m === 'unified') savedViewMode = m; } catch {}
const state = { hashes:{}, seen:{}, current:null, devState:null, diffText:null, collapsedFiles:new Set(Object.keys(savedViewed)), viewed:savedViewed, diffView:savedViewMode };
const saveViewed = () => { try { localStorage.setItem(VIEWED_KEY, JSON.stringify(state.viewed)); } catch {} };
const $ = id => document.getElementById(id);
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33) ^ s.charCodeAt(i); return h >>> 0; };
window.__viewer = state;

async function probe(file, isDiff) {
  try {
    const r = await fetch(dir + file, { cache:'no-store' });
    if (!r.ok) { if (isDiff) state.diffText = null; return null; }
    const t = await r.text();
    if (isDiff) state.diffText = t;
    return hash(t);
  } catch {
    if (isDiff) state.diffText = null;
    return null;
  }
}
async function poll() {
  try { const r = await fetch(dir + 'dev-state.json', { cache:'no-store' }); state.devState = r.ok ? await r.json() : null; } catch { state.devState = null; }
  const results = await Promise.all(PAGES.map(p => p.file ? probe(p.file, p.diff) : Promise.resolve(state.devState ? hash(JSON.stringify(state.devState)) : null)));
  let changedCurrent = false;
  PAGES.forEach((p, i) => {
    const h = results[i];
    if (h !== null && state.hashes[p.key] !== undefined && state.hashes[p.key] !== h) { state.seen[p.key] = false; if (state.current === p.key) changedCurrent = true; }
    state.hashes[p.key] = h;
  });
  render();
  if (changedCurrent && $('auto').checked) {
    if (state.current === 'dashboard') { renderDash(); state.seen.dashboard = true; }
    else if (state.current === 'implement') { renderDiff(); state.seen.implement = true; }
    else reloadFrame();
  }
  else if (state.current === 'dashboard' && state.devState && (waiting() || runningStep())) renderDash();
  else if (state.current === 'implement' && state.devState) renderDiff();
  $('status').textContent = new Date().toLocaleTimeString('ja-JP');
}
const WAIT_KINDS = { question:'サブスキルからの質問(質問リレー)', checkpoint:'チェックポイント停止', 'tier-confirm':'tier 確定の確認', prerequisite:'前提成果物欠如の確認', 'config-approval':'config 追記の承認', 'loop-limit':'ループ上限 / DoD 未充足の報告', resume:'再開の確認' };
const waiting = () => { const w = state.devState?.waiting; return w && typeof w === 'object' ? w : null; };
const runningStep = () => STEPS.find(k => state.devState?.steps?.[k] && !/^(completed|skipped)/.test(state.devState.steps[k])) || null;
const waitLabel = w => WAIT_KINDS[w.kind] || w.kind || '回答待ち';
const waitSince = w => w.since && !isNaN(new Date(w.since)) ? fmtDur(Math.max(0, Date.now() - new Date(w.since))) : '';
function stepStatus(step) {
  const w = waiting(); if (w && step && w.step === step) return 'waiting';
  const s = step && state.devState?.steps?.[step]; if (!s) return '';
  return s.startsWith('completed') ? 'done' : s.startsWith('skipped') ? 'skip' : s;
}
const isAvail = p => p && (state.hashes[p.key] != null || (p.diff && !!stepStatus(p.step) && !/^(done|skip)$/.test(stepStatus(p.step))));
function renderWaiting() {
  const w = waiting(), run = runningStep(), ds = state.devState;
  const base = ds ? `issue #${ds.issue ?? '?'} · dev viewer` : 'dev viewer';
  document.title = w ? `⏸ ${base}` : run ? `▶ ${run} · ${base}` : base;
  document.querySelector('nav').classList.toggle('waiting', !!w);
  const pill = $('waitBar');
  pill.hidden = !w;
  if (w) { const t = waitSince(w); pill.textContent = `⏸ 回答待ち: ${waitLabel(w)}${w.step ? ` (${w.step})` : ''}${t ? ` · ${t}` : ''}`; pill.title = w.summary || ''; }
  const rpill = $('runBar');
  rpill.hidden = !!w || !run;
  if (!w && run) {
    const d = dur(ds?.timings?.[run]);
    rpill.innerHTML = `<span class="dot"></span><span>実行中: ${esc(run)}${d ? ` · ${esc(d)}` : ''}</span>`;
    const target = PAGES.find(p => p.step === run && isAvail(p)) || PAGES[0];
    rpill.onclick = () => target && show(target.key);
  }
}
function render() {
  const ds = state.devState, run = runningStep();
  if (ds) { $('title').innerHTML = issueLink(ds, `issue #${esc(ds.issue)}`); $('meta').textContent = [ds.tier, ds.mode, waiting() ? '⏸ 回答待ち' : ds.status || (run ? `▶ ${run}` : '')].filter(Boolean).join(' / '); }
  else { $('title').textContent = decodeURIComponent(dir.split('/').filter(Boolean).pop() || 'dev viewer'); $('meta').textContent = 'dev-state.json なし'; }
  const nothing = PAGES.every(p => state.hashes[p.key] == null);
  $('empty').textContent = nothing && !ds ? '成果物を読めません。?dir= のパスと、Chrome を --allow-file-access-from-files 付きで起動しているか確認してください' : '左の一覧から成果物を選択';
  $('list').innerHTML = '';
  for (const p of PAGES) {
    const li = document.createElement('li');
    const present = state.hashes[p.key] !== null && state.hashes[p.key] !== undefined;
    const avail = isAvail(p);
    const st = stepStatus(p.step);
    const isRun = st && st !== 'done' && st !== 'skip' && st !== 'waiting';
    li.className = [avail ? 'present' : 'missing', present && state.seen[p.key] === false ? 'updated' : '', st === 'waiting' ? 'waiting' : isRun ? 'running' : '', state.current === p.key ? 'active' : ''].join(' ');
    li.innerHTML = `<span class="dot"></span><span>${p.label}</span><span class="step">${st}</span>`;
    if (avail) li.onclick = () => show(p.key);
    $('list').appendChild(li);
  }
  const curPage = PAGES.find(x => x.key === state.current);
  if (curPage && curPage.file) $('curStep').textContent = stepStatus(curPage.step) ? `(${curPage.step}: ${stepStatus(curPage.step)})` : '';
  renderWaiting();
}
function show(key) {
  const p = PAGES.find(x => x.key === key); if (!p) return;
  state.current = key; state.seen[key] = true;
  location.hash = key;
  $('empty').hidden = true;
  if (!p.file) { $('frame').hidden = true; $('dash').hidden = false; $('diff').hidden = true; $('raw').hidden = true; $('cur').textContent = 'dev-state.json'; $('curStep').textContent = ''; renderDash(); render(); return; }
  if (p.diff) { $('frame').hidden = true; $('dash').hidden = true; $('diff').hidden = false; $('raw').hidden = state.hashes[key] == null; $('raw').href = dir + p.file; $('cur').textContent = p.file; $('curStep').textContent = stepStatus(p.step) ? `(${p.step}: ${stepStatus(p.step)})` : ''; renderDiff(); render(); return; }
  $('frame').hidden = false; $('dash').hidden = true; $('diff').hidden = true; $('raw').hidden = false;
  $('frame').src = dir + p.file; $('raw').href = dir + p.file;
  $('cur').textContent = p.file; $('curStep').textContent = stepStatus(p.step) ? `(${p.step}: ${stepStatus(p.step)})` : '';
  render();
}
const STEPS = ['triage-initial','research','triage-confirm','plan','triage-promote','review-plan','capture-before','implement','create-pr-text','test','review','quiz','notify-discord'];

    ${dod ? `<h2>DoD</h2><table class="t"><tr><th>項目</th><th>判定</th></tr>${dod}</table>` : ''}
    ${extra ? `<h2>その他</h2><table class="t">${extra}</table>` : ''}`;
}
function reloadFrame() {
  const f = $('frame'); let y = 0;
  try { y = f.contentWindow.scrollY; } catch {}
  f.onload = () => { try { f.contentWindow.scrollTo(0, y); } catch {} f.onload = null; state.seen[state.current] = true; render(); };
  f.contentWindow.location.reload();
}
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); const p = PAGES.find(x => x.key === k); if (k && k !== state.current && isAvail(p)) show(k); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !['j','k'].includes(e.key)) return;
  const avail = PAGES.filter(isAvail); const i = avail.findIndex(p => p.key === state.current);
  const n = avail[(i + (e.key === 'j' ? 1 : -1) + avail.length) % avail.length]; if (n) show(n.key);
});
(async () => {
  await poll();
  const want = location.hash.slice(1);
  const first = PAGES.find(p => p.key === want && isAvail(p)) || (state.devState ? PAGES[0] : [...PAGES].reverse().find(isAvail));
  if (first) show(first.key);
  setInterval(() => { if ($('auto').checked) poll(); }, 3000);
})();
</script>
